<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEV36 Contact Sheet</title>
<meta name="description" content="สร้างคอนแทคชีทจากไฟล์สแกนฟิล์ม โทนเหมือนอัดในห้องมืด โดย DEV36 Film Lab">
<meta property="og:title" content="DEV36 Contact Sheet">
<meta property="og:description" content="Make a darkroom-style contact sheet from your film scans. Free, by DEV36 Film Lab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sriracha&display=swap">
<style>
/* Layout: control rail on the left, the print sits on a dim viewing table on the right; stacks on phones with the print first. */
:root{
  --bg:#e8e6df; --panel:#f5f3ee; --fg:#1e1b17; --muted:#6c665c; --line:#d5d0c5;
  --accent:#a8501a; --accent-ink:#fff8ef; --table:#c9c5bb; --chip:#ebe7de;
  --f-ui:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Sriracha","IBM Plex Sans Thai",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110e; --panel:#1e1915; --fg:#ece2d4; --muted:#a39280; --line:#3a3029;
  --accent:#e39a3b; --accent-ink:#1b120a; --table:#0b0907; --chip:#2a221c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110e; --panel:#1e1915; --fg:#ece2d4; --muted:#a39280; --line:#3a3029;
  --accent:#e39a3b; --accent-ink:#1b120a; --table:#0b0907; --chip:#2a221c; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:2px;flex-shrink:0}
.lang button{font-family:var(--f-mono);font-size:11px;padding:4px 8px}
.lang button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:12.5px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:5px 10px;background:var(--chip)}
.links a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.privacy{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:22px}
.stage{padding-block:20px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-mono);font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.group{display:flex;flex-direction:column;gap:10px}
.group>h2{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-direction:column;gap:5px}
.row>label,.lbl{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.lbl output,.row>label output{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font-family:var(--f-mono);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:var(--chip);color:var(--fg)}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.drop.over{border-color:var(--accent)}
.drop strong{font-weight:600}
.drop span{color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12px;margin:0}
button{font:inherit;cursor:pointer;border-radius:5px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 12px}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 14px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--accent);color:var(--accent-ink)}
.table{flex:1;min-height:0;background:var(--table);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
#sheet{display:block;box-shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.28);cursor:crosshair;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20}
.overlay{position:fixed;inset:0;background:rgba(12,10,8,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-height:75vh;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.overlay p{color:#eee;margin:0;text-align:center}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .stage{position:static;height:auto;order:-1;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .table{padding:10px}
  .rail{border-right:0;border-top:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="topline">
        <h1>DEV36 Contact Sheet</h1>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="th" aria-pressed="true">TH</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <p data-i18n="tagline"></p>
      <div class="links">
        <a id="orderLink" class="primary" target="_blank" rel="noopener" hidden data-i18n="order"></a>
        <a id="igLink" target="_blank" rel="noopener"></a>
      </div>
    </div>

    <section class="group">
      <h2 data-i18n="g_files"></h2>
      <p class="hint" data-i18n="howto"></p>
      <label class="drop" id="drop" for="files">
        <strong data-i18n="drop_t"></strong>
        <span data-i18n="drop_s"></span>
      </label>
      <input type="file" id="files" accept="image/*" multiple hidden>
      <div class="checks">
        <label><input type="checkbox" id="invert"> <span data-i18n="invert"></span></label>
      </div>
      <div class="btn-row"><button id="reset" type="button" data-i18n="reset"></button></div>
    </section>

    <section class="group">
      <h2 data-i18n="g_film"></h2>
      <div class="row">
        <span class="lbl" data-i18n="format"></span>
        <div class="seg" id="format">
          <input type="radio" name="fmt" id="f35" value="35" checked><label for="f35">35mm</label>
          <input type="radio" name="fmt" id="f645" value="645"><label for="f645">6×4.5</label>
          <input type="radio" name="fmt" id="f66" value="66"><label for="f66">6×6</label>
          <input type="radio" name="fmt" id="f67" value="67"><label for="f67">6×7</label>
          <input type="radio" name="fmt" id="f69" value="69"><label for="f69">6×9</label>
        </div>
      </div>
      <div class="two">
        <div class="row"><label for="perStrip" data-i18n="per"></label><input type="number" id="perStrip" min="1" max="8" value="6"></div>
        <div class="row"><label for="startNum" data-i18n="start"></label><input type="number" id="startNum" min="0" max="99" value="1"></div>
      </div>
      <div class="row"><label for="edgeText" data-i18n="edge"></label><input type="text" id="edgeText" value="SAFETY FILM 400" maxlength="28"></div>
    </section>

    <section class="group">
      <h2 data-i18n="g_print"></h2>
      <div class="row">
        <span class="lbl" data-i18n="paper"></span>
        <div class="seg" id="paper">
          <input type="radio" name="pp" id="p810" value="8x10" checked><label for="p810">8×10″</label>
          <input type="radio" name="pp" id="pa4" value="A4"><label for="pa4">A4</label>
          <input type="radio" name="pp" id="p1114" value="11x14"><label for="p1114">11×14″</label>
        </div>
      </div>
      <div class="row">
        <span class="lbl" data-i18n="field"></span>
        <div class="seg" id="field">
          <input type="radio" name="fd" id="fdb" value="black" checked><label for="fdb" data-i18n="field_b"></label>
          <input type="radio" name="fd" id="fdw" value="white"><label for="fdw" data-i18n="field_w"></label>
        </div>
      </div>
      <div class="row">
        <label for="tone" data-i18n="tone"></label>
        <select id="tone">
          <option value="warm">Fiber warmtone</option>
          <option value="neutral">RC neutral</option>
          <option value="cool">Cooltone</option>
          <option value="selenium" data-i18n="t_sel"></option>
          <option value="sepia" data-i18n="t_sep"></option>
          <option value="color" data-i18n="t_col"></option>
        </select>
      </div>
      <div class="row"><label for="grade"><span data-i18n="grade"></span> <output id="gradeOut"></output></label><input type="range" id="grade" min="0" max="5" step="0.5" value="2"></div>
      <div class="row"><label for="exposure"><span data-i18n="exposure"></span> <output id="expOut"></output></label><input type="range" id="exposure" min="-1" max="1" step="0.1" value="0"></div>
      <div class="row"><label for="grain"><span data-i18n="grain"></span> <output id="grainOut">30</output></label><input type="range" id="grain" min="0" max="100" step="5" value="30"></div>
      <div class="checks">
        <label><input type="checkbox" id="dust" checked> <span data-i18n="dust"></span></label>
        <label><input type="checkbox" id="vignette" checked> <span data-i18n="vignette"></span></label>
        <label><input type="checkbox" id="jitter" checked> <span data-i18n="jitter"></span></label>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="g_notes"></h2>
      <div class="two">
        <div class="row"><label for="roll" data-i18n="roll"></label><input type="text" id="roll" value="ROLL 01" maxlength="24"></div>
        <div class="row"><label for="note" data-i18n="note"></label><input type="text" id="note" value="" maxlength="40"></div>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="g_marks"></h2>
      <p class="hint" data-i18n="marks_hint"></p>
      <div class="btn-row"><button id="clearMarks" type="button" data-i18n="clear_marks"></button></div>
    </section>

    <section class="group">
      <button class="btn-main" id="export" type="button" data-i18n="save"></button>
      <p class="hint" id="exportHint"></p>
    </section>

    <p class="privacy" data-i18n="privacy"></p>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-head">
      <span class="meta" id="meta">—</span>
      <span class="badge" id="sampleBadge" data-i18n="sample"></span>
    </div>
    <div class="table" id="table"><canvas id="sheet" aria-label="Contact sheet preview"></canvas></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden>
  <img id="ovImg" alt="">
  <p id="ovText"></p>
  <div class="btn-row">
    <button type="button" class="btn-main" id="ovShare" hidden></button>
    <button type="button" id="ovClose"></button>
  </div>
</div>

/* ---------- tone & curve ---------- */

const procCache=new Map();let procKey='';

new ResizeObserver(schedule).observe(table);

  if(!current)return;const b=canvas.getBoundingClientRect(),mx=(e.clientX-b.left)/b.width*current.pw,my=(e.clientY-b.top)/b.height*current.ph;
  const h=current.hits.find(h=>mx>=h.x-1&&mx<=h.x+h.w+1&&my>=h.y-1&&my<=h.y+h.h+1);if(!h)return;
  const m=((state.marks[h.i]||0)+1)%4;if(m)state.marks[h.i]=m;else delete state.marks[h.i];schedule();
});

/* ---------- controls ---------- */
const bindVal=(id,key,num,fmt)=>{const el=$(id);el.addEventListener('input',()=>{state[key]=num?parseFloat(el.value)||0:el.value;fmt&&fmt();schedule()})};
const gradeOut=()=>$('gradeOut').textContent=t('gradeN')+(state.grade%1?state.grade.toFixed(1):state.grade);
const expOut=()=>{const v=state.exposure;$('expOut').textContent=(Math.abs(v)<.05?'±0':(v>0?'+':'−')+Math.abs(v).toFixed(1))+t('stops')};
bindVal('grade','grade',1,gradeOut);bindVal('exposure','exposure',1,expOut);
bindVal('grain','grain',1,()=>$('grainOut').textContent=state.grain);
bindVal('perStrip','perStrip',1);bindVal('startNum','startNum',1);
bindVal('edgeText','edgeText');bindVal('roll','roll');bindVal('note','note');
$('tone').addEventListener('change',e=>{state.tone=e.target.value;schedule()});
['dust','vignette','jitter','invert'].forEach(id=>$(id).addEventListener('change',e=>{state[id]=e.target.checked;schedule()}));
$('format').addEventListener('change',e=>{state.format=e.target.value;state.perStrip=FMT[state.format].per;$('perStrip').value=state.perStrip;
  state.marks={};schedule()});
$('paper').addEventListener('change',e=>{state.paper=e.target.value;schedule()});
$('field').addEventListener('change',e=>{state.field=e.target.value;schedule()});
$('clearMarks').addEventListener('click',()=>{state.marks={};schedule()});
$('reset').addEventListener('click',()=>{state.images=[];state.sample=true;state.marks={};schedule();toast(t('backSample'))});

let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

async function loadFile(f){
  const url=URL.createObjectURL(f);
  try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const M=1400,sc=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
  finally{URL.revokeObjectURL(url)}
}
async function addFiles(list){
  const arr=[...list].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|tiff?|heic)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!arr.length)return;toast(t('loading')(arr.length));
  if(state.sample){state.images=[];state.sample=false;state.marks={}}
  let bad=0;for(const f of arr){try{state.images.push({name:f.name,img:await loadFile(f)})}catch(e){bad++}}
  if(!state.images.length){state.sample=true}
  schedule();toast(bad?t('partial')(arr.length-bad,bad):t('added')(arr.length));
}
$('files').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
const drop=$('drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();if(t==='drop'||e.target===document.documentElement)drop.classList.remove('over')}));
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---------- export ---------- */
// Works for anyone, no account needed. Inside the Claude page viewer a direct download is blocked,
// so the finished sheet is shown full-size to save with a long-press (phone) or right-click (computer).
// Hosted anywhere else (your own website), the file downloads directly.
const inViewer=!!window.claude||window.top!==window.self;
let ovUrl=null,ovFile=null;
// Phones and tablets: saving through the share sheet puts the sheet in the Photos app;
// a plain download only lands in Files.
// iPadOS with a keyboard or trackpad reports a fine pointer and a Mac user agent, so check touch points too.
const ua=navigator.userAgent||'';
const touch=/iPhone|iPad|iPod|Android/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)||window.matchMedia('(pointer:coarse)').matches;
function canShareFile(f){try{return !inViewer&&!!navigator.canShare&&navigator.canShare({files:[f]})}catch(e){return false}}
function showOverlay(blob,name){
  if(ovUrl)URL.revokeObjectURL(ovUrl);ovUrl=URL.createObjectURL(blob);
  ovFile=new File([blob],name,{type:'image/jpeg'});
  const share=canShareFile(ovFile);
  $('ovImg').src=ovUrl;$('ovText').textContent=share?t('sharehint'):t('longpress');
  $('ovShare').textContent=t('toPhotos');$('ovShare').hidden=!share;
  $('ovClose').textContent=t('close');$('overlay').hidden=false;
}
$('ovShare').addEventListener('click',async()=>{
  try{await navigator.share({files:[ovFile]})}catch(e){/* closed the share sheet */}
});
$('ovClose').addEventListener('click',()=>{$('overlay').hidden=true});
$('export').addEventListener('click',async()=>{
  const btn=$('export');btn.disabled=true;btn.textContent=t('saving');
  try{
    await new Promise(r=>setTimeout(r,30));
    const Lo=layout(),k=300/25.4,c=document.createElement('canvas');c.width=Math.round(Lo.pw*k);c.height=Math.round(Lo.ph*k);
    render(c.getContext('2d'),k,Lo);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.93));
    const name=('contact-'+(state.roll||'sheet')).replace(/[^\w\u0E00-\u0E7F-]+/g,'-').toLowerCase()+'.jpg';
    if(!inViewer&&!touch){
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);toast(t('saved'));return;
    }
    showOverlay(blob,name);
  }finally{btn.disabled=false;btn.textContent=t('save')}
});

/* ---------- language & links ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  gradeOut();expOut();schedule();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('dev36cs-lang',lang)}catch(e){}applyLang()}));
if(CONFIG.orderUrl){$('orderLink').href=CONFIG.orderUrl;$('orderLink').hidden=false}
if(CONFIG.instagram){$('igLink').href='https://instagram.com/'+CONFIG.instagram;$('igLink').textContent='IG @'+CONFIG.instagram}else $('igLink').hidden=true;
{const d=new Date(),p=n=>String(n).padStart(2,'0');state.note=`${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`;$('note').value=state.note}
applyLang();
gradeOut();expOut();draw();
if(document.fonts){Promise.all([document.fonts.load('6px "Sriracha"'),document.fonts.load('500 2px "IBM Plex Mono"')]).then(schedule,()=>{});document.fonts.ready.then(schedule)}
})();
</script>
